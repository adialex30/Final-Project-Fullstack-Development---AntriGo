#      host: ${REDIS_HOST}
#      port: ${REDIS_PORT}
#      password: ${REDIS_PASSWORD:}
#      ssl:
#        enabled: ${REDIS_SSL:false}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.antrigo.backend: INFO
